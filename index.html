  <div id="print-root" aria-hidden="true"></div>
  <script>
    // แสดงข้อผิดพลาดบนหน้าเว็บแทนหน้าว่าง (ในแอป LINE/มือถือดู console ไม่ได้)
    (function () {
      function show(msg) {
        var v = document.getElementById('view');
        if (!v || v.querySelector('.boot-error')) return;
        if (v.innerHTML.trim() && !v.querySelector('.loading')) return;
        v.innerHTML = '<div class="empty-state box boot-error"><h1>เปิดหน้าเว็บไม่สำเร็จ</h1><p>' +
          String(msg || '').replace(/</g, '&lt;') + '</p><button class="btn btn-cta" onclick="location.reload()">ลองใหม่</button></div>';
      }
      window.addEventListener('error', function (e) { show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message); });
    })();
  </script>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
